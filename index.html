<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNS 프로필 활동지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 예시작 발표용과 같은 무대. 휴대폰 대신 A4 활동지 한 장을 가운데 세우고, 칸을 하나씩 짚어 가며 설명. */
:root{
  --ink:#111318; --sub:#6b6f78; --line:#e3e4e8;
  --ring1:#feda75; --ring2:#fa7e1e; --ring3:#d62976; --ring4:#962fbf; --cf:#22b14c;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus,button:focus-visible{outline:none}

.paperwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.paper{position:relative;height:min(1060px,calc(100vh - 90px));aspect-ratio:210/297;max-width:calc(100vw - 32px);background:#fff;border-radius:6px;box-shadow:0 0 0 1px #e6e7ec,0 24px 70px rgba(40,30,80,.18);overflow:hidden}
.paper img{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .35s ease}
.paper img.hide{opacity:0}
/* 칸 짚기: 선택한 칸만 밝게, 나머지는 살짝 어둡게 */
.spot{position:absolute;border-radius:10px;pointer-events:none;opacity:0;
  box-shadow:0 0 0 9999px rgba(20,18,35,.42);transition:all .55s cubic-bezier(.2,.7,.2,1)}
.spot.on{opacity:1}
.spot::before{content:"";position:absolute;inset:-4px;border-radius:13px;padding:3px;
  background:conic-gradient(from 200deg,var(--ring1),var(--ring2),var(--ring3),var(--ring4),var(--ring1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.spot.round{border-radius:50%}.spot.round::before{border-radius:50%}
.hot{position:absolute;border-radius:8px;cursor:pointer}
.hot:hover{background:rgba(214,41,118,.06)}
.spot .tag{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,#fa7e1e,#d62976,#962fbf);padding:5px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(150,47,191,.3)}
.spot.below .tag{bottom:auto;top:calc(100% + 12px)}
.spot.tl .tag{left:6px;transform:none}.spot.tr .tag{left:auto;right:6px;transform:none}

.dots{display:flex;gap:8px;align-items:center}
.dots button{font-size:13px;font-weight:700;color:var(--sub);padding:5px 12px;border-radius:999px;background:#f1f2f5;transition:all .3s}
.dots button.on{color:#fff;background:#16171b}
.dots .prog{font-size:12px;color:var(--sub);margin-left:6px;min-width:44px}

/* 발표 모드(P): 활동지가 오른쪽으로 가고 왼쪽에 설명 */
body.present .paperwrap{transform:translateX(min(22vw,360px))}
.pnote{position:fixed;left:max(5vw,24px);top:50%;width:min(38vw,600px);transform:translate(-30px,-50%);opacity:0;pointer-events:none;transition:opacity .5s ease .25s,transform .7s cubic-bezier(.2,.7,.2,1) .15s;color:#1d1f27;z-index:5}
body.present .pnote{opacity:1;transform:translate(0,-50%)}
.pnote .kick{display:inline-block;font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff;background:linear-gradient(90deg,#fa7e1e,#d62976,#962fbf);padding:5px 14px;border-radius:999px;margin-bottom:18px}
.pnote h2{font-size:clamp(28px,2.6vw,44px);line-height:1.25;margin:0 0 22px;font-weight:700;letter-spacing:-.02em}
.pnote ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pnote li{font-size:clamp(17px,1.35vw,23px);line-height:1.55;padding-left:22px;position:relative;color:#2b2e38}
.pnote li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:9px;border-radius:50%;background:#d62976}
.pnote li b{color:#111}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;margin:0 3px}
.sw.all{background:conic-gradient(var(--ring1),var(--ring2),var(--ring3),var(--ring4),var(--ring1))}
.sw.cf{background:var(--cf)}
.pnote .fade{animation:pf .45s ease}
@keyframes pf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){body.present .paperwrap{transform:none}.pnote{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>

<div class="pnote" id="pnote" aria-live="polite"></div>

<div class="paperwrap">
  <div class="paper" id="paper">
    <img id="img1" src="images/p1.png?v=1125b" alt="활동지 1쪽: 프로필, 하이라이트, 피드">
    <img id="img2" src="images/p2.png?v=1125b" alt="활동지 2쪽: 스토리 2개" class="hide">
    <img id="img3" src="images/p3.png?v=1125b" alt="활동지 3쪽: 작성 요령" class="hide">
    <div id="hots"></div>
    <div class="spot" id="spot"><span class="tag" id="tag"></span></div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
/* =========================================================
   CONFIG: 여기 글만 고치면 설명이 바뀜.  <b>굵게</b> 사용 가능
   box: 활동지 한 쪽 기준 % 좌표 (x, y, w, h)
   ========================================================= */
const CONFIG = {
  pages: ["1쪽 프로필", "2쪽 스토리", "3쪽 작성 요령"],
  steps: [
    { page:1, kick:"SNS 프로필 활동지 · 1쪽", title:"캐릭터가 직접 운영하는 인스타 계정",
      points:["1차시에 만든 <b>오리지널 캐릭터</b>의 계정이라고 생각하고 채움", "완성하면 <b>실제 인스타 프로필</b>처럼 보이도록 칸을 그대로 옮김", "1쪽에 프로필·하이라이트·피드, 2쪽에 스토리, 3쪽은 작성 요령"] },
    { page:1, label:"프로필 사진", box:{x:6.19,y:7.75,w:27.62,h:19.53}, round:true, below:true,
      kick:"프로필 사진", title:"캐릭터의 얼굴을 크게",
      points:["큰 동그라미 안에 <b>캐릭터 얼굴</b>을 그림", "스토리를 올렸으니 바깥 <b>고리는 색칠</b>", "고리 색은 2쪽 스토리의 공개 범위와 같은 색"] },
    { page:1, label:"아이디", box:{x:37.3,y:11.2,w:57,h:5.2},
      kick:"아이디", title:"이름 하나로 캐릭터가 보이게",
      points:["<b>영어 소문자·숫자·밑줄(_)·마침표(.)</b>만 사용", "캐릭터 이름, 별명, 특징을 섞어서 만듦", "가장 크게, 프로필 사진 오른쪽 맨 위에"] },
    { page:1, label:"이름 · 게시물 · 팔로워 · 팔로잉", box:{x:37.3,y:17,w:57,h:6.8},
      kick:"이름 · 숫자", title:"숫자도 캐릭터 해석",
      points:["아이디 아래 줄에 <b>캐릭터 이름</b>", "<b>팔로워·팔로잉</b>은 세계관 속 유명한 정도, 사교성에 맞게", "게시물 수도 학생이 직접 정함"] },
    { page:1, label:"직업", box:{x:5.4,y:28.8,w:22,h:3.9},
      kick:"직업", title:"세계관 속에서 하는 일",
      points:["짧은 밑줄에 캐릭터의 <b>직업이나 소속</b>을 한 단어로", "실제 인스타의 '카테고리' 자리", "소개란과 피드 첫 칸으로 이어지는 단서"] },
    { page:1, label:"소개 세 줄", box:{x:5.4,y:31.9,w:89.2,h:12.6},
      kick:"소개", title:"캐릭터가 자기를 소개하는 세 줄",
      points:["<b>소속, 성격, 좋아하는 것, 말버릇</b>을 한 줄씩", "글은 모두 <b>캐릭터의 말투</b>로", "이모지·해시태그도 좋음"] },
    { page:1, label:"스토리 하이라이트 (선택)", box:{x:5.1,y:49.9,w:57.9,h:15.2},
      kick:"하이라이트 · 선택", title:"프로필에 고정해 두는 이야기",
      points:["<b>0~3개</b>, 만들지 말지 스스로 정함", "동그라미에 표지 그림, 아래에 <b>짧은 제목</b>", "안 만들면 비워 둬도 됨"] },
    { page:1, label:"피드 첫 칸 · 세계관 속 캐릭터의 역할", box:{x:1.9,y:69.31,w:31.81,h:28.34},
      kick:"피드 첫 칸 · 필수", title:"세계관 속 캐릭터의 역할",
      points:["첫 칸은 꼭 <b>역할</b>이 보이는 그림", "직업·소속뿐 아니라 이야기 속 <b>기능</b>(주인공의 조력자, 메인 빌런, 라이벌 등)도 역할", "그림만 봐도 역할이 보이게"] },
    { page:1, label:"피드 2·3칸 · 자유 주제", box:{x:34.09,y:69.31,w:64,h:28.34},
      kick:"피드 2·3칸", title:"자유 주제",
      points:["캐릭터가 <b>직접 올렸을 법한</b> 사진 두 장", "작품 속 <b>기억에 남는 장면</b>을 게시물로 바꿔도 좋음", "세 칸을 이어 보면 하나의 이야기가 되게"] },
    { page:2, kick:"SNS 프로필 활동지 · 2쪽", title:"스토리 2개",
      points:["주제: <b>내 캐릭터는 여가 시간에 무엇을 하고 있을까?</b>", "그 순간을 한 장씩 그리고 <b>글 한 줄</b>과 스티커", "막히면 소지품·OOTD, 한 순간, 기분 한 장, 질문 스티커, 비포&애프터 중에서 골라 보기"] },
    { page:2, label:"스토리 1", box:{x:5.71,y:22.52,w:42.86,h:53.87},
      kick:"스토리 1", title:"여가 시간의 한 장면",
      points:["위쪽 작은 동그라미에 <b>프로필 얼굴</b>, 옆 줄에 <b>아이디</b>", "화면 위에 캐릭터가 쓴 <b>글 한 줄</b>", "투표·질문·이모지 <b>스티커</b>를 붙이듯 그림"] },
    { page:2, label:"공개 범위 · 고리 색", box:{x:5.71,y:22.52,w:88.58,h:53.87},
      kick:"공개 범위", title:"누구에게 보여 줄까?",
      points:["<span class='sw all'></span><b>전체공개</b>: 고리를 빨강·주황·보라 계열로. 누구에게 보여도 괜찮은 모습", "<span class='sw cf'></span><b>친한친구</b>: 고리를 초록으로. 속마음, 숨은 모습", "2개를 어떻게 나눌지도 <b>캐릭터 해석</b>"] },
    { page:3, kick:"SNS 프로필 활동지 · 3쪽", title:"작성 요령",
      points:["칸마다 <b>무엇을, 어떻게</b> 쓰는지 한 장에 정리", "학생이 활동 중에 <b>혼자 보고</b> 따라 할 수 있게", "<b>공개 범위</b> 색 규칙도 여기에 함께 정리", "이제 <b>예시작</b>으로 이 칸들이 채워진 모습을 봐요"] }
  ]
};
/* ========================================================= */

const $=id=>document.getElementById(id);
const S=CONFIG.steps;
let cur=0, presentOn=false;

// 쪽 버튼
$('dots').innerHTML=CONFIG.pages.map((t,i)=>`<button data-p="${i+1}">${t}</button>`).join('')+'<span class="prog" id="prog"></span>';
$('dots').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)go(S.findIndex(s=>s.page==b.dataset.p));});

function renderHots(page){
  $('hots').innerHTML=S.map((s,i)=>s.box&&s.page===page?`<button class="hot" data-i="${i}" aria-label="${s.label}" style="left:${s.box.x}%;top:${s.box.y}%;width:${s.box.w}%;height:${s.box.h}%"></button>`:'').join('');
}
$('hots').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i;go(i===cur?S.findIndex(s=>s.page===S[i].page):i);});

function go(i){
  if(i<0||i>=S.length)return;
  const prev=S[cur], s=S[i]; cur=i;
  [1,2,3].forEach(p=>$('img'+p).classList.toggle('hide',p!==s.page));
  if(!prev||prev.page!==s.page||!$('hots').children.length)renderHots(s.page);
  const sp=$('spot');
  if(s.box){
    Object.assign(sp.style,{left:s.box.x+'%',top:s.box.y+'%',width:s.box.w+'%',height:s.box.h+'%'});
    sp.classList.toggle('round',!!s.round); sp.classList.toggle('below',!!s.below||s.box.y<10);
    const c=s.box.x+s.box.w/2; sp.classList.toggle('tl',c<22); sp.classList.toggle('tr',c>78);
    $('tag').textContent=s.label; sp.classList.add('on');
  } else sp.classList.remove('on');
  document.querySelectorAll('#dots [data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===s.page));
  $('prog').textContent=(i+1)+' / '+S.length;
  $('pnote').innerHTML=`<div class="fade"><span class="kick">${s.kick||''}</span><h2>${s.title||''}</h2><ul>${(s.points||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(e.code==='KeyP'||k==='p'||k==='P'||k==='ㅔ'){presentOn=!presentOn;document.body.classList.toggle('present',presentOn);return;}
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'){e.preventDefault();go(cur+1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(cur-1);}
  else if(k==='Escape'){go(S.findIndex(s=>s.page===S[cur].page));}
  else if(k==='Home'){go(0);}
  else if(['1','2','3'].includes(k)){go(S.findIndex(s=>s.page==k));}
});
// 활동지 바깥 빈 곳 클릭: 다음
document.body.addEventListener('click',e=>{if(e.target===document.body)go(cur+1);});

go(0);
</script>
</body></html>
